name: CI

on:
  push:
    branches: [ latest ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # compile.php inlines the jush, JsShrink and PhpShrink submodules

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: adminer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name adminer -p 8080:8080 adminer:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/adminer.php && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/adminer.php | grep -q '<title>Login - Adminer'
          curl -fsS -o /dev/null http://127.0.0.1:8080/adminer.php?file=default.css
          docker logs adminer
          docker stop adminer
