# Adminer plus a PostgreSQL, MariaDB and Valkey server for local testing.
# Run: git submodule update --init --recursive && docker compose up -d
# Open: http://127.0.0.1:8080/
# Credentials: user and password "adminer", database "adminer".
# Server names: postgres, mariadb, valkey (Valkey needs no password).

services:
  adminer:
    build: .
    image: ghcr.io/agungdh/adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: adminer
      POSTGRES_USER: adminer
      POSTGRES_PASSWORD: adminer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U adminer -d adminer" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: adminer
      MARIADB_USER: adminer
      MARIADB_PASSWORD: adminer
      MARIADB_ROOT_PASSWORD: adminer
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  mariadb-data:
  valkey-data:
